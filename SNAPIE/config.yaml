# Converted from nextflow.config (initial scaffold).
genome: "hg19"
report_peak_genomic_annotation: true
fragle_ct_estimation: false
exclude_dac_regions: true
deduped_bam: true
outputFolder: "/date/gcb/gcb_MZ/SNAPIE"
until: "BAM_SIGNAL_PROCESSING"
read_method: "PE"
trim_method: "FASTP"
containers:
  multiqc: "quay.io/biocontainers/multiqc:1.25.2--pyhdfd78af_0"
  bwa: "quay.io/biocontainers/bwa:0.7.18--he4a0461_1"
  samtools: "quay.io/biocontainers/samtools:1.15.1--h1170115_0"

# Paths to auxiliar programs (preserve relative paths)
pathEnrichmentScript: "auxiliar_programs/enrichment.sh"
pathRPileups: "auxiliar_programs/read_pileups.R"
pathSNPSMaSH: "auxiliar_programs/SMaSH.py"

# Samples / input 
samplesheet: /home/mattia/cfChromatin_in_MS/SNAPIE/config/samplesheet.csv
sample_dir_bam: null
 
# Paths
refdir: "/home/mattia/Genomes/hg19/"
genome_fa: "/home/mattia/Genomes/hg19/fa/bwa/hg19"
genome_fasta: "/home/mattia/Genomes/hg19/fa/hg19.fa"
chrom_sizes: "/home/mattia/Genomes/hg19/hg19.chrom.sizes"
reads_dir: "reads"
controls_dir: "controls"
 
# Tool parameters (mirrors nextflow.config)
filter_samtools_pe_params: "-f 3 -F 3844 -q 30"
filter_samtools_se_params: "-F 3844 -q 30"
trimming_params: "--q 20"
trimming_params_fastp: "--adapter_sequence=AGATCGGAAGAGCACACGTCTGAACTCCAGTCA --adapter_sequence_r2=AGATCGGAAGAGCGTCGTGTAGGGAAAGAGTGT"
bwa_params: "-I 250,200,2000,10"
#deeptools
binsize: "10"
norm_method: "RPKM"
smooth_length: "300"

# External published fragment BED files (Sadeh et al., GSE accession)
external_bed_dir: "/date/gcb/gcb_MZ/Analysis/BED/H3K27ac"

# Enrichment score (chromHMM on/off-target reference BEDs)
# Build once with: python auxiliar_programs/build_chromhmm_reference.py
#   --chromhmm_dir  /path/to/roadmap_chromhmm_beds
#   --chrom_sizes   /home/mattia/Genomes/hg19/hg19.chrom.sizes
#   --blacklist     /home/mattia/Genomes/hg19/hg19-blacklist.v2.bed
#   --out_dir       ref_files  --threads 8
#
# Fallback pair, used for any mark absent from enrichment_targets below and
# for the external published cohort (which is H3K27ac-only).
chromhmm_ontarget:  "ref_files/chromhmm_ontarget_H3K27ac.bed"
chromhmm_offtarget: "ref_files/chromhmm_offtarget_H3K27ac.bed"

# Per-mark reference regions, keyed on the samplesheet 'enrichment_mark' column.
# Region counts match the source publication exactly:
#   H3K27ac   1,651 on  /  219,809 off
#   H3K4me3   8,174 on  /  281,426 off
enrichment_targets:
  H3K27ac:
    ontarget:  "ref_files/chromhmm_ontarget_H3K27ac.bed"
    offtarget: "ref_files/chromhmm_offtarget_H3K27ac.bed"
  H3K4me3:
    ontarget:  "ref_files/chromhmm_ontarget_H3K4me3.bed"
    offtarget: "ref_files/chromhmm_offtarget_H3K4me3.bed"

# Per-mark QC cut-offs. Applied independently within each mark.
#
# The two marks sit on comparable score scales: against like-for-like libraries
# (Ctrl V4) H3K27ac runs median 14.4 / max 38.1 and H3K4me3 median 22.7 /
# max 37.1, which is why the source publication lands on two near-identical
# cut-offs (8.5 / 8.7). 7 is kept here for both, as previously pinned.
#
# Calibration anchors measured on this cohort, on the H3K4me3 region set:
#   failed libraries              0.62 - 0.69   (depleted, below the null of 1)
#   H3K27ac libraries, wrong mark 6.5  - 12.4   (generic TSS capture)
#   true H3K4me3 libraries        4.2  - 37.1
qc_thresholds:
  H3K27ac:
    enrichment: 7
    fragments:  1000000
  H3K4me3:
    enrichment: 7
    fragments:  1000000

# Meta-coverage plots (cfChIP-seq Sadeh style: TSS + Enhancer panels)
housekeeping_promoters_bed: "ref_files/housekeeping_promoters.bed"
pathMetaPlotScript: "auxiliar_programs/meta_plot_housekeeping.R"
pathMetaPlotR: "/home/mattia/cfChromatin_in_MS/cfChIP-seq_Sadeh/MetaPlot.R"
meta_genes_bed: "/date/gcb/gcb_MZ/Analysis/cfChIP-seq/SetupFiles/H3K27ac/Meta-genes.bed"
meta_enhancers_bed: "/date/gcb/gcb_MZ/Analysis/cfChIP-seq/SetupFiles/H3K27ac/Meta-enhancers.bed"
meta_plot_binsize: 25
